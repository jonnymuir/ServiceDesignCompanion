name: DAST

# OWASP ZAP baseline (passive rules only) against the booted app, from jonnymuir/ci-security.
# Starts advisory; set fail-action: true and require "baseline / DAST baseline" once
# .zap/rules.tsv is triaged.
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'   # nightly 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: jonnymuir/ci-security/.github/workflows/dast-baseline.yml@a080cb3ded30b38c92820fd8be7860eb29e26b5e # v1.4.0
    permissions:
      contents: read
    with:
      dotnet-version: '10.0.401'
      # Fresh SQLite database with an unattended install. The admin password is a fixed value for
      # this throwaway runner database, not a secret.
      boot-command: >-
        mkdir -p src/ServiceDesignCompanion.Site/umbraco/Data &&
        env ASPNETCORE_ENVIRONMENT=Development
        Umbraco__CMS__Unattended__InstallUnattended=true
        Umbraco__CMS__Unattended__UnattendedUserName=Admin
        Umbraco__CMS__Unattended__UnattendedUserEmail=admin@example.test
        Umbraco__CMS__Unattended__UnattendedUserPassword=dast-runner-only-1
        dotnet run --project src/ServiceDesignCompanion.Site --urls http://127.0.0.1:8080
      target-url: http://127.0.0.1:8080
      health-path: /umbraco
      fail-action: false
