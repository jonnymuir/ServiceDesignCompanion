name: Deploy

# Deploys the site to servicedesign.prismreference.com: a systemd service on the VPS, listening on
# localhost:5003 behind Cloudflare Tunnel. Manual dispatch only. Configuration and secrets live in
# /etc/servicedesign/env on the VPS and are never touched here; each run replaces only the app's
# files. The database is disposable: content is reseeded from code on every boot, so the app
# directory is wiped before the new build is copied in.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish
        # linux-x64 only: the VPS is x86-64, and other platforms' native libraries would add 175 MB.
        run: dotnet publish src/ServiceDesignCompanion.Site/ServiceDesignCompanion.Site.csproj -c Release -r linux-x64 --no-self-contained -o publish

      - name: Stop the service
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ env.VPS_PASSWORD }}
          script: sudo systemctl stop servicedesign

      - name: Clear the previous deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ env.VPS_PASSWORD }}
          script: sudo find /var/www/servicedesign -mindepth 1 -delete

      - name: Copy the build to the VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ env.VPS_PASSWORD }}
          source: "publish/*"
          target: "/var/www/servicedesign/"
          strip_components: 1

      - name: Fix permissions and start the service
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ env.VPS_PASSWORD }}
          script: |
            sudo mkdir -p /var/www/servicedesign/umbraco/Data
            sudo chown -R www-data:www-data /var/www/servicedesign
            sudo systemctl start servicedesign

      # Checks the public URL through Cloudflare, not just the process on the VPS. A first boot runs
      # Umbraco's unattended install and seeds the content, hence the retry budget.
      - name: Wait for the site to come up
        run: |
          for i in $(seq 1 40); do
            if curl --fail -s -o /dev/null https://servicedesign.prismreference.com/the-service-standard/; then
              echo "Healthy after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://servicedesign.prismreference.com did not become healthy in time"
          exit 1
