name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ServiceDesignCompanion.slnx
      - name: Build
        run: dotnet build ServiceDesignCompanion.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ServiceDesignCompanion.slnx -c Release --no-build
      - name: Size budgets
        run: node scripts/check-policies.mjs
      - name: Doc links
        run: node scripts/check-doc-links.mjs

  # One aggregate check, so the ruleset names "all" instead of every job.
  all:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    permissions: {}
    steps:
      - name: Decide whether checks have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Some checks failed: $RESULTS"
              exit 1
            fi
          done
          echo "All checks passed"
